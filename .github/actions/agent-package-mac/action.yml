name: "Prepare klogg mac packages"
description: "Prepare klogg mac packages"
inputs:
  codesign-identity:
    description: Developer ID Application identity matching the supplied certificate
    required: false
  p12-file-base64:
    required: false
  p12-password:
    required: false
  notarization-username:
    required: false
  notarization-team:
    required: false
  notarization-password:
    required: false

runs:
  using: "composite"
  steps:
    - name: Mac prepare codesign
      id: prepare-codesign
      if: ${{ github.event_name != 'pull_request' && inputs.p12-file-base64 != '' && inputs.codesign-identity != '' }}
      uses: apple-actions/import-codesign-certs@v7
      with:
        p12-file-base64: ${{ inputs.p12-file-base64 }}
        p12-password: ${{ inputs.p12-password }}

    - name: Mac deploy Qt
      shell: sh
      run: |
        cd $KLOGG_BUILD_ROOT
        macdeployqt ./output/klogg.app -always-overwrite -verbose=2

    - name: Mac deploy Qt fixing
      if: "startsWith(matrix.config.qt_version, '5')"
      shell: sh
      run: |
        python3 $KLOGG_BUILD_ROOT/macdeployqtfix.py $KLOGG_BUILD_ROOT/output/klogg.app/Contents/MacOS/klogg "$QT_ROOT_DIR"

    - name: Mac deploy Qt fixing
      if: "startsWith(matrix.config.qt_version, '6')"
      shell: sh
      run: |
        python3 $KLOGG_BUILD_ROOT/macdeployqtfix.py $KLOGG_BUILD_ROOT/output/klogg.app/Contents/MacOS/klogg "$QT_ROOT_DIR"

    - name: Set packaging env
      shell: sh
      run: |
        echo "KLOGG_DMG=klogg-${{ env.KLOGG_VERSION }}-mac-${{ env.KLOGG_ARCH }}.dmg" >> $GITHUB_ENV
        echo "KLOGG_PKG=klogg-${{ env.KLOGG_VERSION }}-mac-${{ env.KLOGG_ARCH }}.pkg" >> $GITHUB_ENV

    - name: Mac codesign binaries
      if: ${{ steps.prepare-codesign.outcome == 'success' }}
      shell: sh
      env:
        KLOGG_CODESIGN: ${{ inputs.codesign-identity }}
      run: |
        cd $KLOGG_BUILD_ROOT
        codesign -v -f -o runtime --deep --timestamp -s "$KLOGG_CODESIGN" ./output/klogg.app;

    - name: Ad-hoc sign app without Developer ID credentials
      if: ${{ steps.prepare-codesign.outcome != 'success' }}
      shell: sh
      run: |
        codesign --force --deep --sign - "$KLOGG_BUILD_ROOT/output/klogg.app"
        codesign --verify --deep --strict "$KLOGG_BUILD_ROOT/output/klogg.app"

    - name: Mac pack dmg
      shell: sh
      run: |
        cd $KLOGG_BUILD_ROOT
        cpack --verbose -G "DragNDrop"
        mv ./packages/klogg-${{ env.KLOGG_VERSION }}-OSX.dmg ./packages/${{ env.KLOGG_DMG }}

    - name: Mac codesign dmg
      if: ${{ steps.prepare-codesign.outcome == 'success' }}
      shell: sh
      env:
        KLOGG_CODESIGN: ${{ inputs.codesign-identity }}
      run: |
        cd $KLOGG_BUILD_ROOT
        codesign -v -f -o runtime --timestamp -s "$KLOGG_CODESIGN" ./packages/${{ env.KLOGG_DMG }}

    - name: Mac notarize DMG
      id: notarize-dmg
      if: ${{ steps.prepare-codesign.outcome == 'success' && inputs.notarization-username != '' && inputs.notarization-team != '' && inputs.notarization-password != '' }}
      shell: sh
      run: |
        xcrun notarytool submit --wait --apple-id "${{ inputs.notarization-username }}" --team-id "${{ inputs.notarization-team }}" --password "${{ inputs.notarization-password }}" "${{ env.KLOGG_BUILD_ROOT }}/packages/${{ env.KLOGG_DMG }}" | tee dmg_notary.log
        dmg_notary_id=$(awk '$1=="id:"{id=$2} END{print id}' dmg_notary.log)
        xcrun notarytool log --apple-id "${{ inputs.notarization-username }}" --team-id "${{ inputs.notarization-team }}" --password "${{ inputs.notarization-password }}" "$dmg_notary_id" "dmg_notary.log.json"
        cat "dmg_notary.log.json"

    - name: Mac staple DMG
      if: ${{ steps.notarize-dmg.outcome == 'success' }}
      shell: sh
      run: |
        xcrun stapler staple "${{ env.KLOGG_BUILD_ROOT }}/packages/${{ env.KLOGG_DMG }}"

    - name: Mac symbols
      shell: sh
      run: |
        cd $KLOGG_BUILD_ROOT
        cp -a ./output/klogg.dSym ./packages/klogg-${{ env.KLOGG_ARCH }}.dSym
        cp -a ./output/klogg.app ./packages/klogg-${{ env.KLOGG_ARCH }}.app
